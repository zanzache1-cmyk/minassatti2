<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>منصة الإسناد الاحترافية</title>
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .glass { background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }
        input, select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: right; }
        .status { font-size: 0.8rem; color: #a1a1aa; }
    </style>
</head>
<body>
<div class="container">
    <div class="glass">
        <h2>إسناد الأساتذة (حفظ تلقائي)</h2>
        <div id="formContainer">
            <!-- الحقول -->
            <input type="text" id="surname" placeholder="اللقب" onchange="autoSave()">
            <input type="text" id="forename" placeholder="الاسم" onchange="autoSave()">
            <select id="level" onchange="autoSave()">
                <option value="">اختر المستوى</option>
                <option value="أولى ابتدائي">أولى ابتدائي</option>
                <option value="ثانية ابتدائي">ثانية ابتدائي</option>
            </select>
            <!-- إلخ لباقي الحقول -->
        </div>
        <div id="status" class="status">جاهز</div>
    </div>

    <div class="glass">
        <h2>الجدول الحالي</h2>
        <table id="dataTable">
            <thead><tr><th>التاريخ</th><th>اللقب</th><th>الاسم</th><th>المستوى</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const ENDPOINT = "رابط_الـ_Exec_الجديد";

    // الحفظ التلقائي
    function autoSave() {
        document.getElementById('status').innerText = "جاري الحفظ...";
        const data = {
            surname: document.getElementById('surname').value,
            forename: document.getElementById('forename').value,
            level: document.getElementById('level').value
            // أضف باقي الحقول
        };
        fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(data) })
            .then(() => {
                document.getElementById('status').innerText = "تم الحفظ تلقائياً";
                fetchData(); // تحديث الجدول بعد الحفظ
            });
    }

    // جلب البيانات للجدول
    async function fetchData() {
        const response = await fetch(ENDPOINT);
        const data = await response.json();
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        data.slice(1).forEach(row => {
            tbody.innerHTML += `<tr><td>${row[0]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[5]}</td></tr>`;
        });
    }

    fetchData(); // تحميل البيانات عند فتح الصفحة
</script>
</body>
</html>
