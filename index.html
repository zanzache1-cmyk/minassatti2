<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- [ضع هنا كامل كود الـ CSS الأصلي الخاص بك] -->
    <style>
        /* [نفس تصميمك الأصلي] */
        .live-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; color: #111; }
        .live-table th, .live-table td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        .live-table th { background: #4a2c11; color: white; }
    </style>
</head>
<body>
    <!-- [ضع هنا كامل كود الـ HTML الأصلي الخاص بك] -->
    
    <!-- قسم الجدول المباشر -->
    <section class="card">
        <h2>جدول البيانات المباشر</h2>
        <table class="live-table">
            <thead><tr><th>اللقب</th><th>الاسم</th><th>المستوى</th></tr></thead>
            <tbody id="liveData"></tbody>
        </table>
    </section>

    <script>
        const ENDPOINT = "https://script.google.com/macros/s/AKfycbwG9CrHjkpVCyR6dT-GkWyeJf2Le2RUblouth7NZvT6R3qNCcNz2NBcvBub0uugbpvB/exec";

        // الحفظ التلقائي لكل حقل
        function autoSave() {
            var d = {};
            // جمع البيانات من النموذج الأصلي الخاص بك
            S.forEach(function(sec){sec.f.forEach(function(f){
                var el = document.getElementById("f_"+f.k);
                if(el) d[f.k] = el.value;
            })});
            
            fetch(ENDPOINT, {method: "POST", body: JSON.stringify(d)})
            .then(() => {
                console.log("تم الحفظ");
                updateTable(); 
            });
        }

        // عرض البيانات
        async function updateTable() {
            const res = await fetch(ENDPOINT);
            const data = await res.json();
            const tbody = document.getElementById("liveData");
            tbody.innerHTML = "";
            // عرض آخر 5 إدخالات
            data.slice(-5).forEach(row => {
                tbody.innerHTML += `<tr><td>${row[2]}</td><td>${row[3]}</td><td>${row[5]}</td></tr>`;
            });
        }

        // تفعيل الحفظ التلقائي عند أي تغيير
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll("input, select").forEach(el => {
                el.addEventListener("change", autoSave);
            });
            updateTable();
        });
    </script>
</body>
</html>
