<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>جدول إسناد الأساتذة - منصة إلكترونية</title>
    <!-- [تم الاحتفاظ بنفس CSS الخاص بك الأصلي تماماً] -->
    <style>
        /* (أضف هنا كامل كود الـ CSS الأصلي الخاص بك كما هو) */
        /* سأضع هنا تنسيقاً إضافياً للجدول ليتناسب مع تصميمك */
        .table-card { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #333; }
        th { background: #4a2c11; color: white; padding: 10px; }
        td { padding: 10px; border: 1px solid #ccc; text-align: center; }
    </style>
</head>
<body>
    <!-- [هنا ضع محتوى الـ HTML الأصلي الخاص بك كما هو] -->
    <!-- [بما فيه الهيدر Board والـ Form] -->

    <!-- أضف هذا القسم تحت الفورم مباشرة لعرض الجدول -->
    <div id="tableContainer" class="card">
        <h2>الأساتذة المسجلون</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>التاريخ</th><th>المؤسسة</th><th>اللقب</th><th>الاسم</th><th>المستوى</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbw6JjWf2sLSIyKM_8FN0KU7ILuKLdkiDwG7poYj64vZNnobHVk1FDtTR2Q78zTjCd3X/exec";

    // دالة الحفظ التلقائي
    function autoSave() {
        var d = {};
        S.forEach(function(sec){sec.f.forEach(function(f){
            var el = document.getElementById("f_"+f.k);
            if(el) d[f.k] = el.value;
        })});
        
        fetch(ENDPOINT, {method: "POST", body: JSON.stringify(d)})
        .then(() => {
            console.log("تم الحفظ تلقائياً");
            fetchData(); // تحديث الجدول فوراً
        });
    }

    // دالة جلب البيانات للجدول
    async function fetchData() {
        const response = await fetch(ENDPOINT);
        const data = await response.json();
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        // عرض آخر 10 سجلات مثلاً
        data.slice(-10).forEach(row => {
            tbody.innerHTML += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[5]}</td></tr>`;
        });
    }

    // إضافة مستمع للحفظ التلقائي لكل الحقول
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll("input, select").forEach(el => {
            el.addEventListener("change", autoSave);
        });
        fetchData(); // تحميل البيانات عند البدء
    });

    // [أضف هنا باقي كود الـ JavaScript الأصلي الخاص بك]
</script>
</body>
</html>
